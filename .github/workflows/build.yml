# Testlar, Windows o‘rnatuvchisi va Release.
#
# Har push’da: testlar (Ubuntu va Windows), BulutSkan_Setup.exe yig‘iladi va
# toza Windows’da tekshiriladi: jim o‘rnatish -> ish stolidagi belgi orqali
# ishga tushirish -> /health 200 -> namoyish, AHP, JSON/DOCX hisobot -> o‘chirish.
# v* tegi push qilinganda shu o‘rnatuvchi GitHub Release’ga joylanadi.

name: build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  test:
    name: testlar (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Bog‘liqliklar
        run: python -m pip install -e ".[dev]"
      - name: mypy
        if: runner.os == 'Linux'
        run: python -m mypy bulutskan tests
      - name: pytest
        run: python -m pytest -q

  installer:
    name: Windows o‘rnatuvchisi
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Versiya
        id: ver
        run: |
          $v = (Select-String -Path bulutskan/__init__.py -Pattern '__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "Teg $env:GITHUB_REF_NAME va bulutskan.__version__ ($v) mos emas"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Versiya: $v"

      - name: PyInstaller
        run: |
          python -m pip install . "pyinstaller>=6.10,<7"
          pyinstaller packaging/bulutskan.spec --noconfirm --distpath dist --workpath build
          & dist/BulutSkan/BulutSkan.exe --version
          if ($LASTEXITCODE -ne 0) { throw "BulutSkan.exe --version ishlamadi" }

      - name: Inno Setup
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" packaging\bulutskan.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC xatosi" }
          $hash = (Get-FileHash dist\BulutSkan_Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  BulutSkan_Setup.exe" | Set-Content -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt
          "{0:N1} MB" -f ((Get-Item dist\BulutSkan_Setup.exe).Length / 1MB)

      - name: Jim o‘rnatish
        run: |
          $p = Start-Process dist\BulutSkan_Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 40; throw "O‘rnatuvchi kodi: $($p.ExitCode)" }
          $exe = "$env:LOCALAPPDATA\Programs\BulutSkan\BulutSkan.exe"
          if (-not (Test-Path $exe)) { throw "$exe topilmadi" }
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'BulutSkan.lnk'
          if (-not (Test-Path $lnk)) { throw "Ish stolidagi belgi yaratilmadi: $lnk" }
          Write-Host "O‘rnatildi: $exe; belgi: $lnk"

      - name: Administrator (CLI)
        env:
          SMOKE_PASSWORD: Smoke-Test-Parol-2026
        run: |
          $exe = "$env:LOCALAPPDATA\Programs\BulutSkan\BulutSkan.exe"
          $env:SMOKE_PASSWORD | & $exe user add smoke --role admin --password-stdin
          if ($LASTEXITCODE -ne 0) { throw "user add ishlamadi" }

      - name: Ish stolidagi belgi orqali ishga tushirish
        env:
          BULUTSKAN_OPEN_BROWSER: "false"
        run: |
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'BulutSkan.lnk'
          Start-Process $lnk
          Start-Sleep -Seconds 3
          if (-not (Get-Process BulutSkan -ErrorAction SilentlyContinue)) { throw "BulutSkan jarayoni ishga tushmadi" }

      - name: Smoke test (/health, namoyish, AHP, hisobotlar)
        env:
          SMOKE_PASSWORD: Smoke-Test-Parol-2026
        run: python packaging/smoke_test.py --url http://127.0.0.1:8000/ --timeout 240

      - name: Ikkinchi ishga tushirish yangi nusxa ochmaydi
        run: |
          $exe = "$env:LOCALAPPDATA\Programs\BulutSkan\BulutSkan.exe"
          $out = & $exe serve --no-browser 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'allaqachon ishlayapti') { throw "Ikkinchi nusxa ochildi" }

      - name: To‘xtatish va o‘chirish (ma’lumotlar saqlanadi)
        if: always()
        run: |
          Get-Process BulutSkan -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $un = "$env:LOCALAPPDATA\Programs\BulutSkan\unins000.exe"
          if (Test-Path $un) {
            $p = Start-Process $un -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
            Start-Sleep -Seconds 3
            if (Test-Path "$env:LOCALAPPDATA\Programs\BulutSkan\BulutSkan.exe") { throw "Dastur o‘chirilmadi" }
            if (-not (Test-Path "$env:LOCALAPPDATA\BulutSkan\data\bulutskan.db")) { throw "Foydalanuvchi ma’lumotlari o‘chib ketdi" }
            Write-Host "O‘chirildi; ma’lumotlar saqlanib qoldi."
          }

      - uses: actions/upload-artifact@v4
        with:
          name: BulutSkan_Setup
          path: |
            dist/BulutSkan_Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: jurnallar
          path: |
            install.log
            build/bulutskan/warn-bulutskan.txt
          if-no-files-found: ignore

  release:
    name: GitHub Release
    needs: installer
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: BulutSkan_Setup
          path: dist
      - name: Release yaratish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed -e "s|{{SHA256}}|$(cut -d' ' -f1 dist/SHA256SUMS.txt)|" \
              -e "s|{{REPO_URL}}|${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}|" packaging/release_notes.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/BulutSkan_Setup.exe dist/SHA256SUMS.txt \
            --title "BulutSkan ${GITHUB_REF_NAME#v}" --notes-file notes.md
