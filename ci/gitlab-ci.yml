# BulutSkan: GitLab CI namunasi.
#
# Faylni o‘z loyihangizga .gitlab-ci.yml sifatida qo‘shing (yoki include qiling).
# Runner’da Docker bo‘lishi kerak (docker:dind xizmati yoki shell executor).
#   chiqish kodi 0 — chegaradan oshmadi,
#               1 — --fail-on darajasidagi topilma bor (konveyer to‘xtaydi),
#               2 — biror vosita ishlamadi (qisman natija; istisno: --allow-partial).

stages: [security]

variables:
  BULUTSKAN_REF: v1.0.0
  BULUTSKAN_DATA_DIR: "$CI_PROJECT_DIR/.bulutskan"
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

bulutskan:
  stage: security
  image: python:3.12-slim
  services:
    - docker:27-dind
  timeout: 45 minutes
  cache:
    key: bulutskan-db
    paths:
      - .bulutskan/db/
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends docker.io git >/dev/null
    - pip install -q "bulutskan @ git+https://github.com/Abduvokhobov5888/blutlik_texnologiya@${BULUTSKAN_REF}"
    - bulutskan tools pull
    # Checkov obrazi yig‘iladi va ID si qulflanadi (birinchi ishonch tamoyili).
    - bulutskan tools build-checkov
    - bulutskan tools lock-checkov
    - bulutskan tools verify
    - bulutskan db-update
  script:
    - bulutskan scan --iac infra --fail-on high --json hisobot/iac.json --docx hisobot/iac.docx
    - docker build -t "ilova:$CI_COMMIT_SHORT_SHA" .
    - docker save "ilova:$CI_COMMIT_SHORT_SHA" -o ilova.tar
    - >
      bulutskan scan --image-tar ilova.tar --image-name "ilova:$CI_COMMIT_SHORT_SHA"
      --fail-on critical --fixable-only
      --json hisobot/obraz.json --docx hisobot/obraz.docx
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - hisobot/
